name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostGIS only. OSRM and VROOM are not started: the integration tests and the real-VROOM e2e skip when they are down.
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: shibutz
          POSTGRES_PASSWORD: shibutz
          POSTGRES_DB: shibutz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shibutz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
